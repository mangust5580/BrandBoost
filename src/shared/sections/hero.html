<section class="hero" aria-labelledby="hero-title" data-section="hero">
  <div class="container hero__inner">
    <div class="hero__content">
      <h1 class="hero__title" id="hero-title">
        BrandBoost: системный рост продаж через стратегию, аналитику и performance-каналы
      </h1>
      <p class="hero__lead">
        Мы разрабатываем и внедряем цифровые стратегии продвижения, основанные на данных и адаптированные под задачи вашего бизнеса,
        чтобы бренд рос быстрее и выделялся в цифровой среде.
      </p>
      <a class="hero__cta button button--primary button--lg" href="#contacts">Начать сейчас</a>
    </div>
    <div class="hero__media" aria-hidden="true">
      <picture class="hero__picture">
        <source
          type="image/avif"
          srcset="
            images/hero/hero-rocket-240.avif 240w,
            images/hero/hero-rocket-320.avif 320w,
            images/hero/hero-rocket-480.avif 480w,
            images/hero/hero-rocket-640.avif 640w,
            images/hero/hero-rocket-1060.avif 1060w
          "
          sizes="(max-width: 480px) 120px, (max-width: 575px) 188px, (max-width: 1023px) 306px, (max-width: 1279px) 530px, (max-width: 1439px) 640px, 760px"
        />
        <source
          type="image/webp"
          srcset="
            images/hero/hero-rocket-240.webp 240w,
            images/hero/hero-rocket-320.webp 320w,
            images/hero/hero-rocket-480.webp 480w,
            images/hero/hero-rocket-640.webp 640w,
            images/hero/hero-rocket-1060.webp 1060w
          "
          sizes="(max-width: 480px) 120px, (max-width: 575px) 188px, (max-width: 1023px) 306px, (max-width: 1279px) 530px, (max-width: 1439px) 640px, 760px"
        />
        <img
          class="hero__image"
          src="images/hero/hero-rocket-640.png"
          srcset="
            images/hero/hero-rocket-240.png 240w,
            images/hero/hero-rocket-320.png 320w,
            images/hero/hero-rocket-480.png 480w,
            images/hero/hero-rocket-640.png 640w,
            images/hero/hero-rocket-1060.png 1060w
          "
          sizes="(max-width: 480px) 120px, (max-width: 575px) 188px, (max-width: 1023px) 306px, (max-width: 1279px) 530px, (max-width: 1439px) 640px, 760px"
          width="760"
          height="800"
          alt=""
          fetchpriority="high"
          decoding="async"
        />
      </picture>
    </div>
  </div>
</section>
